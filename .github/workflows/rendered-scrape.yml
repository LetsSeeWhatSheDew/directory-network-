name: Rendered deal scrape

# The real-browser deal reader (scripts/scrape-rendered-deals.ts), moved off
# Matthew's Mac so deals stay fresh when the Mac is asleep. Same script, same
# rules: each store's own site only, robots.txt respected, bot challenges
# skipped, never solved. Writes source='website_rendered' deals, menu
# snapshots and a scraper_runs row, exactly as the Mac run did.
#

on:
  # Six slots a day. GitHub started the old twice-daily slots 7-10 hours late
  # (Nov 22-25), so on Green Wednesday morning nothing had run. More slots
  # means a run lands every few hours even with that delay. Public repo:
  # Actions minutes are free. Runs never overlap (concurrency below).
  schedule:
    - cron: '7 1 * * *'
    - cron: '7 5 * * *'
    - cron: '7 9 * * *'
    - cron: '7 13 * * *'
    - cron: '7 17 * * *'
    - cron: '7 21 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write to the database (unchecked = dry run, read only)'
        type: boolean
        default: true
      slug:
        description: 'Optional: only these stores (comma-separated slug parts)'
        type: string
        default: ''

concurrency:
  group: rendered-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TZ: America/Chicago
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --include=dev --no-audit --no-fund
      # The runner image ships Google Chrome; the script launches channel
      # "chrome". Print the version so a broken image is obvious in the log.
      - run: google-chrome --version
      - name: Scrape
        env:
          EVENT: ${{ github.event_name }}
          APPLY_INPUT: ${{ inputs.apply }}
          SLUG_INPUT: ${{ inputs.slug }}
        run: |
          ARGS=""
          if [ "$EVENT" = "schedule" ] || [ "$APPLY_INPUT" = "true" ]; then ARGS="--apply"; fi
          if [ -n "$SLUG_INPUT" ]; then ARGS="$ARGS --slug=$SLUG_INPUT"; fi
          echo "args: ${ARGS:-(dry run)}"
          npx tsx scripts/scrape-rendered-deals.ts $ARGS
