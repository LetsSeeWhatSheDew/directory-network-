name: Alert signup probe

# One real signup on production with PuffPrice's own address (hi@puffprice.com).
# Run by hand from the Actions tab when the signup path needs proving.
on:
  workflow_dispatch: {}
  push:
    branches: [claude/sweet-maxwell-9f298m]
    paths: ['scripts/alert-signup-probe.mjs', 'scripts/resend-domain-check.mjs']

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Resend domain status (read-only)
        run: node scripts/resend-domain-check.mjs
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      - run: node scripts/alert-signup-probe.mjs
